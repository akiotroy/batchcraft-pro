<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BatchCraft Pro - Plant Management Engine</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap');
    body {
      font-family: 'Inter', sans-serif;
    }
    .font-mono {
      font-family: 'JetBrains Mono', monospace;
    }

    /* Print Stylesheet - Corrects blank page issue and formats to exact A4 size */
    @media print {
      @page {
        size: A4 portrait;
        margin: 0;
      }
      body {
        background: #fff !important;
        color: #000 !important;
        margin: 0 !important;
        padding: 0 !important;
      }
      /* Hide everything inside body during print */
      body > * {
        display: none !important;
      }
      /* Ensure root display tree is hidden */
      #root {
        display: none !important;
      }
      /* Show printable area */
      #printable-delivery-note,
      #printable-delivery-note * {
        display: block !important;
        visibility: visible !important;
      }
      /* Target table rows/cells specifically so display:block doesn't break layout */
      #printable-delivery-note table {
        display: table !important;
      }
      #printable-delivery-note tr {
        display: table-row !important;
      }
      #printable-delivery-note th,
      #printable-delivery-note td {
        display: table-cell !important;
      }
      #printable-delivery-note flex,
      #printable-delivery-note .flex {
        display: flex !important;
      }
      #printable-delivery-note grid,
      #printable-delivery-note .grid {
        display: grid !important;
      }
      #printable-delivery-note {
        position: absolute !important;
        left: 0 !important;
        top: 0 !important;
        width: 100% !important;
        margin: 0 !important;
        padding: 10mm !important;
        background-color: white !important;
        color: black !important;
        box-shadow: none !important;
        border: none !important;
        border-radius: 0 !important;
      }
      .no-print {
        display: none !important;
      }
      [contenteditable="true"] {
        outline: none !important;
        border: none !important;
      }
    }

    /* Subtle hover effect for inline editable text elements on screen */
    [contenteditable="true"]:hover {
      background-color: rgba(243, 244, 246, 0.8);
      outline: 1px dashed #9ca3af;
      border-radius: 2px;
      cursor: text;
    }
    [contenteditable="true"]:focus {
      background-color: #ffffff;
      outline: 2px solid #3b82f6;
      border-radius: 2px;
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen">

  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    // Preset Concrete Mix Designs (Base Metric: kg, m³, °C)
    const INITIAL_MIXES = [
      { id: '30mpa', name: '30 MPa Standard Structural', cement: 350, fineAgg: 820, coarseAgg: 1040, water: 175, wRatio: 0.50 },
      { id: '25mpa', name: '25 MPa Residential Slab', cement: 310, fineAgg: 850, coarseAgg: 1060, water: 185, wRatio: 0.60 },
      { id: '40mpa', name: '40 MPa High Early / Bridge', cement: 420, fineAgg: 780, coarseAgg: 1020, water: 160, wRatio: 0.38 },
      { id: 'scc', name: 'Self-Consolidating (SCC)', cement: 460, fineAgg: 890, coarseAgg: 850, water: 180, wRatio: 0.39 }
    ];

    // Conversion Constants
    const KG_TO_LBS = 2.20462;
    const M3_TO_YD3 = 1.30795;
    const L_TO_GAL = 0.264172;
    const KG_M3_TO_PCF = 0.062428;

    function App() {
      // Unit Configurator State: 'metric' (m³, kg, °C, L) or 'imperial' (yd³, lbs, °F, gal)
      const [unitSystem, setUnitSystem] = useState('metric');

      // Active Navigation Tab
      const [activeTab, setActiveTab] = useState('batch-adjuster');

      // Dynamic Mix Recipes List
      const [mixes, setMixes] = useState(INITIAL_MIXES);
      const [editingMixId, setEditingMixId] = useState(null);
      const [editFormData, setEditFormData] = useState(null);
      
      // New Mix Creation Form State
      const [showAddMixModal, setShowAddMixModal] = useState(false);
      const [newMixName, setNewMixName] = useState('');
      const [newMixCement, setNewMixCement] = useState(350);
      const [newMixFine, setNewMixFine] = useState(800);
      const [newMixCoarse1, setNewMixCoarse1] = useState(500);
      const [newMixCoarse2, setNewMixCoarse2] = useState(500);
      const [newMixAdmixture, setNewMixAdmixture] = useState(0);
      const [newMixWater, setNewMixWater] = useState(175);

      // Global Batch Configuration State
      const [selectedMixId, setSelectedMixId] = useState('30mpa');
      const [loadVolume, setLoadVolume] = useState(6.0); // m³

      // Aggregate Properties
      const [fineMoisture, setFineMoisture] = useState(4.5);
      const [fineAbs, setFineAbs] = useState(1.0);
      const [coarseMoisture, setCoarseMoisture] = useState(1.8);
      const [coarseAbs, setCoarseAbs] = useState(0.5);

      // Temperature Variables (Stored in °C)
      const [tempCement, setTempCement] = useState(45);
      const [tempAgg, setTempAgg] = useState(24);
      const [tempWater, setTempWater] = useState(18);
      const [useIce, setUseIce] = useState(false);
      const [icePct, setIcePct] = useState(20);

      // Delivery Ticket Modal State
      const [showTicketModal, setShowTicketModal] = useState(false);
      
      // Dynamic state variables for ALL editable ticket fields
      const [companyName, setCompanyName] = useState('BatchCraft Concrete Ltd.');
      const [plantDetails, setPlantDetails] = useState('Central Batching Plant #04 • Tel: (555) 019-2831');
      const [companyTagline, setCompanyTagline] = useState('Quality Assured Ready-Mix Concrete');
      const [ticketNo, setTicketNo] = useState('DN-84920');
      const [ticketTitle, setTicketTitle] = useState('DELIVERY NOTE');
      const [customer, setCustomer] = useState('BuildCo Construction Ltd');
      const [siteAddress, setSiteAddress] = useState('124 Main Street, Commercial Zone');
      const [truckNo, setTruckNo] = useState('TR-14');
      const [driver, setDriver] = useState('J. Doe');
      const [slumpTarget, setSlumpTarget] = useState('100 mm / 4 in');
      const [timeDispatched, setTimeDispatched] = useState(new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }));
      
      // Additional Custom Ticket Labels & Terms (100% Editable)
      const [labelCustomer, setLabelCustomer] = useState('Customer / Contractor:');
      const [labelAddress, setLabelAddress] = useState('Delivery Location / Address:');
      const [labelDispatch, setLabelDispatch] = useState('Dispatch Time:');
      const [labelTruck, setLabelTruck] = useState('Truck No:');
      const [labelDriver, setLabelDriver] = useState('Driver:');
      const [labelSlump, setLabelSlump] = useState('Target Slump:');
      const [labelDriverSig, setLabelDriverSig] = useState('Driver Signature:');
      const [labelCustSig, setLabelCustSig] = useState('Site Customer Acceptance Signature:');
      const [labelWaterAdded, setLabelWaterAdded] = useState('If water added on site:');
      const [labelWaterAmount, setLabelWaterAmount] = useState('Water added:');
      const [disclaimerText, setDisclaimerText] = useState('Received in good condition.');
      const [waterWarningText, setWaterWarningText] = useState('Additional site water added voids warranty.');

      // Dynamic Unit Labels
      const isMetric = unitSystem === 'metric';
      const volUnit = isMetric ? 'm³' : 'yd³';
      const massUnit = isMetric ? 'kg' : 'lbs';
      const liquidUnit = isMetric ? 'L' : 'gal';
      const tempUnit = isMetric ? '°C' : '°F';
      const densityUnit = isMetric ? 'kg/m³' : 'lbs/yd³';

      // Conversions for UI Display / Inputs
      const displayVolume = isMetric ? loadVolume : (loadVolume * M3_TO_YD3);
      const displayTempCement = isMetric ? tempCement : Math.round((tempCement * 9/5) + 32);
      const displayTempAgg = isMetric ? tempAgg : Math.round((tempAgg * 9/5) + 32);
      const displayTempWater = isMetric ? tempWater : Math.round((tempWater * 9/5) + 32);

      // Selected Base Mix Recipe
      const currentMix = useMemo(() => {
        return mixes.find(m => m.id === selectedMixId) || mixes[0] || INITIAL_MIXES[0];
      }, [selectedMixId, mixes]);

      // Mix Recipe Handlers
      const handleCreateMix = (e) => {
        e.preventDefault();
        if (!newMixName.trim()) return;
        const c = parseFloat(newMixCement) || 0;
        const w = parseFloat(newMixWater) || 0;
        const c1 = parseFloat(newMixCoarse1) || 0;
        const c2 = parseFloat(newMixCoarse2) || 0;
        const adm = parseFloat(newMixAdmixture) || 0;
        const newMix = {
          id: 'custom-' + Date.now(),
          name: newMixName,
          cement: c,
          fineAgg: parseFloat(newMixFine) || 0,
          coarseAgg1: c1,
          coarseAgg2: c2,
          coarseAgg: c1 + c2,
          admixture: adm,
          water: w,
          wRatio: c > 0 ? parseFloat((w / c).toFixed(2)) : 0
        };
        setMixes([...mixes, newMix]);
        setSelectedMixId(newMix.id);
        setShowAddMixModal(false);
        setNewMixName('');
      };

      const startEditingMix = (mix) => {
        setEditingMixId(mix.id);
        setEditFormData({ ...mix });
      };

      const handleSaveEditMix = () => {
        const c = parseFloat(editFormData.cement) || 0;
        const w = parseFloat(editFormData.water) || 0;
        const updatedMix = {
          ...editFormData,
          cement: c,
          fineAgg: parseFloat(editFormData.fineAgg) || 0,
          coarseAgg: parseFloat(editFormData.coarseAgg) || 0,
          water: w,
          wRatio: c > 0 ? parseFloat((w / c).toFixed(2)) : 0
        };
        setMixes(mixes.map(m => m.id === editingMixId ? updatedMix : m));
        setEditingMixId(null);
        setEditFormData(null);
      };

      const handleDeleteMix = (id) => {
        if (mixes.length <= 1) return;
        const updated = mixes.filter(m => m.id !== id);
        setMixes(updated);
        if (selectedMixId === id) {
          setSelectedMixId(updated[0].id);
        }
      };

      // Calculations Engine
      const calculations = useMemo(() => {
        const fineFreeMoisturePct = fineMoisture - fineAbs;
        const coarseFreeMoisturePct = coarseMoisture - coarseAbs;

        const baseCement = currentMix.cement * loadVolume;
        const baseFineDry = currentMix.fineAgg * loadVolume;
        const baseCoarseDry = (currentMix.coarseAgg !== undefined ? currentMix.coarseAgg : (currentMix.coarseAgg1 + currentMix.coarseAgg2)) * loadVolume;
        const baseWaterDesign = currentMix.water * loadVolume;

        const adjustedFineScale = baseFineDry * (1 + fineMoisture / 100);
        const adjustedCoarseScale = baseCoarseDry * (1 + coarseMoisture / 100);

        const fineFreeWater = baseFineDry * (fineFreeMoisturePct / 100);
        const coarseFreeWater = baseCoarseDry * (coarseFreeMoisturePct / 100);
        const totalFreeWater = fineFreeWater + coarseFreeWater;

        const netWaterScale = Math.max(0, baseWaterDesign - totalFreeWater);

        const volCement = baseCement / (3.15 * 1000);
        const volFine = baseFineDry / (2.65 * 1000);
        const volCoarse = baseCoarseDry / (2.68 * 1000);
        const volNetWater = netWaterScale / (1.00 * 1000);
        const volFreeWater = totalFreeWater / (1.00 * 1000);
        const totalSolidWaterVol = volCement + volFine + volCoarse + volNetWater + volFreeWater;
        
        const estimatedYieldM3 = totalSolidWaterVol / 0.98;
        const totalWetBatchMass = baseCement + adjustedFineScale + adjustedCoarseScale + netWaterScale;
        const wetUnitWeightKgM3 = totalWetBatchMass / loadVolume;

        const Mc = baseCement;
        const Ma = baseFineDry + baseCoarseDry;
        const Mw = netWaterScale;
        const Mwa = totalFreeWater;

        const numerator = 0.22 * (tempCement * Mc + tempAgg * Ma) + (tempWater * Mw) + (tempAgg * Mwa);
        const denominator = 0.22 * (Mc + Ma) + Mw + Mwa;
        let estimatedTempC = numerator / denominator;

        if (useIce) {
          const iceMass = netWaterScale * (icePct / 100);
          const coolingEffect = (iceMass * 80) / (0.22 * (Mc + Ma) + Mw + Mwa);
          estimatedTempC = Math.max(5, estimatedTempC - (coolingEffect * 0.12));
        }

        return {
          fineFreeMoisturePct,
          coarseFreeMoisturePct,
          baseCement,
          baseFineDry,
          baseCoarseDry,
          baseWaterDesign,
          adjustedFineScale,
          adjustedCoarseScale,
          fineFreeWater,
          coarseFreeWater,
          totalFreeWater,
          netWaterScale,
          estimatedYieldM3,
          wetUnitWeightKgM3,
          estimatedTempC
        };
      }, [currentMix, loadVolume, fineMoisture, fineAbs, coarseMoisture, coarseAbs, tempCement, tempAgg, tempWater, useIce, icePct]);

      // Helper function to dynamically output weights/volumes based on chosen unit system
      const formatMass = (kgVal) => Math.round(isMetric ? kgVal : kgVal * KG_TO_LBS);
      const formatLiquid = (lVal) => Math.round(isMetric ? lVal : lVal * L_TO_GAL);
      const formatVol = (m3Val) => (isMetric ? m3Val : m3Val * M3_TO_YD3).toFixed(2);
      const formatDensity = (kgM3Val) => Math.round(isMetric ? kgM3Val : kgM3Val * KG_TO_LBS / M3_TO_YD3);
      const formatTemp = (tempCVal) => isMetric ? tempCVal.toFixed(1) : ((tempCVal * 9/5) + 32).toFixed(1);

      return (
        <div className="flex flex-col min-h-screen">
          {/* Header Bar */}
          <header className="bg-slate-900 border-b border-slate-800 sticky top-0 z-40">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
              <div className="flex items-center space-x-3">
                <div className="bg-amber-500 text-slate-950 p-2 rounded-lg font-black text-xl tracking-wider">
                  BC
                </div>
                <div>
                  <h1 className="text-lg font-bold text-slate-100 leading-none">BatchCraft <span className="text-amber-500 font-mono text-xs px-2 py-0.5 rounded bg-amber-500/10 border border-amber-500/20">PRO</span></h1>
                  <p className="text-xs text-slate-400">Concrete Batching & Yield Optimization Engine</p>
                </div>
              </div>

              <div className="flex items-center space-x-4">
                {/* Unit Measurement Switcher */}
                <div className="bg-slate-950 p-1 rounded-xl border border-slate-800 flex items-center space-x-1">
                  <button
                    onClick={() => setUnitSystem('metric')}
                    className={`px-3 py-1.5 rounded-lg text-xs font-bold transition-all ${
                      isMetric ? 'bg-amber-500 text-slate-950 shadow' : 'text-slate-400 hover:text-slate-200'
                    }`}
                  >
                    METRIC (kg/m³)
                  </button>
                  <button
                    onClick={() => setUnitSystem('imperial')}
                    className={`px-3 py-1.5 rounded-lg text-xs font-bold transition-all ${
                      !isMetric ? 'bg-amber-500 text-slate-950 shadow' : 'text-slate-400 hover:text-slate-200'
                    }`}
                  >
                    IMPERIAL (lbs/yd³)
                  </button>
                </div>

                <nav className="flex space-x-1 bg-slate-950 p-1 rounded-xl border border-slate-800">
                  <button
                    onClick={() => setActiveTab('batch-adjuster')}
                    className={`px-4 py-2 rounded-lg text-sm font-medium transition-all ${
                      activeTab === 'batch-adjuster' ? 'bg-amber-500 text-slate-950 shadow-md font-semibold' : 'text-slate-400 hover:text-slate-200'
                    }`}
                  >
                    Moisture & Scale Trim
                  </button>
                  <button
                    onClick={() => setActiveTab('temp-engine')}
                    className={`px-4 py-2 rounded-lg text-sm font-medium transition-all ${
                      activeTab === 'temp-engine' ? 'bg-amber-500 text-slate-950 shadow-md font-semibold' : 'text-slate-400 hover:text-slate-200'
                    }`}
                  >
                    Concrete Temp & Ice
                  </button>
                  <button
                    onClick={() => setActiveTab('mix-library')}
                    className={`px-4 py-2 rounded-lg text-sm font-medium transition-all ${
                      activeTab === 'mix-library' ? 'bg-amber-500 text-slate-950 shadow-md font-semibold' : 'text-slate-400 hover:text-slate-200'
                    }`}
                  >
                    Mix Recipes
                  </button>
                </nav>

                <button
                  onClick={() => setShowTicketModal(true)}
                  className="bg-emerald-600 hover:bg-emerald-500 text-white px-4 py-2 rounded-xl text-sm font-bold shadow-lg transition-all flex items-center space-x-2 border border-emerald-400/30"
                >
                  <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M17 17h2a2 2 0 002-2v-4a2 2 0 00-2-2H5a2 2 0 00-2 2v4a2 2 0 002 2h2m2 4h6a2 2 0 002-2v-4a2 2 0 00-2-2H9a2 2 0 00-2 2v4a2 2 0 002 2zm8-12V5a2 2 0 00-2-2H9a2 2 0 00-2 2v4h10z"></path></svg>
                  <span>Delivery Note</span>
                </button>
              </div>
            </div>
          </header>

          {/* Main Content Area */}
          <main className="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8">
            
            <div className="bg-slate-900 border border-slate-800 rounded-2xl p-6 mb-8 shadow-xl">
              <div className="grid grid-cols-1 md:grid-cols-3 gap-6 items-center">
                <div>
                  <label className="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-2">Active Mix Design</label>
                  <select
                    value={selectedMixId}
                    onChange={(e) => setSelectedMixId(e.target.value)}
                    className="w-full bg-slate-950 border border-slate-700 rounded-xl px-4 py-3 text-slate-100 font-medium focus:ring-2 focus:ring-amber-500 focus:outline-none"
                  >
                    {mixes.map(mix => (
                      <option key={mix.id} value={mix.id}>{mix.name} (w/c: {mix.wRatio})</option>
                    ))}
                  </select>
                </div>

                <div>
                  <div className="flex justify-between items-center mb-2">
                    <label className="text-xs font-semibold uppercase tracking-wider text-slate-400">Batch Truck Volume</label>
                    <span className="font-mono text-amber-400 font-bold">{formatVol(loadVolume)} {volUnit}</span>
                  </div>
                  <input
                    type="range"
                    min="1.0"
                    max="12.0"
                    step="0.5"
                    value={loadVolume}
                    onChange={(e) => setLoadVolume(parseFloat(e.target.value))}
                    className="w-full accent-amber-500 h-2 bg-slate-800 rounded-lg appearance-none cursor-pointer"
                  />
                  <div className="flex justify-between text-[10px] text-slate-500 mt-1 font-mono">
                    <span>{formatVol(1.0)} {volUnit}</span>
                    <span>{formatVol(6.0)} {volUnit}</span>
                    <span>{formatVol(12.0)} {volUnit}</span>
                  </div>
                </div>

                <div className="bg-slate-950 p-4 rounded-xl border border-slate-800/80 flex justify-between items-center">
                  <div>
                    <span className="block text-[11px] font-semibold text-slate-400 uppercase tracking-wider">Estimated Unit Density</span>
                    <span className="text-xl font-mono font-bold text-slate-100">{formatDensity(calculations.wetUnitWeightKgM3)} <span className="text-xs text-slate-400 font-sans">{densityUnit}</span></span>
                  </div>
                  <div className="text-right">
                    <span className="block text-[11px] font-semibold text-slate-400 uppercase tracking-wider">Calculated Vol. Yield</span>
                    <span className={`text-xl font-mono font-bold ${Math.abs(calculations.estimatedYieldM3 - loadVolume) > 0.1 ? 'text-amber-400' : 'text-emerald-400'}`}>
                      {formatVol(calculations.estimatedYieldM3)} <span className="text-xs text-slate-400 font-sans">{volUnit}</span>
                    </span>
                  </div>
                </div>
              </div>
            </div>

            {/* TAB 1 */}
            {activeTab === 'batch-adjuster' && (
              <div className="grid grid-cols-1 lg:grid-cols-12 gap-8">
                <div className="lg:col-span-5 space-y-6">
                  <div className="bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-lg">
                    <div className="flex justify-between items-center mb-4">
                      <h3 className="text-md font-bold text-amber-400">Sand / Fine Aggregate</h3>
                      <span className="text-xs font-mono bg-slate-800 text-slate-300 px-2 py-1 rounded">
                        Dry Base: {formatMass(currentMix.fineAgg * loadVolume).toLocaleString()} {massUnit}
                      </span>
                    </div>

                    <div className="space-y-4">
                      <div>
                        <div className="flex justify-between text-sm mb-1">
                          <span className="text-slate-300">Total Moisture Content:</span>
                          <span className="font-mono text-amber-400 font-bold">{fineMoisture}%</span>
                        </div>
                        <input
                          type="range"
                          min="0.0"
                          max="10.0"
                          step="0.1"
                          value={fineMoisture}
                          onChange={(e) => setFineMoisture(parseFloat(e.target.value))}
                          className="w-full accent-amber-500 h-2 bg-slate-800 rounded-lg appearance-none cursor-pointer"
                        />
                      </div>

                      <div>
                        <div className="flex justify-between text-sm mb-1">
                          <span className="text-slate-300">Aggregate Absorption Capacity:</span>
                          <span className="font-mono text-slate-400">{fineAbs}%</span>
                        </div>
                        <input
                          type="range"
                          min="0.0"
                          max="3.0"
                          step="0.1"
                          value={fineAbs}
                          onChange={(e) => setFineAbs(parseFloat(e.target.value))}
                          className="w-full accent-slate-600 h-2 bg-slate-800 rounded-lg appearance-none cursor-pointer"
                        />
                      </div>

                      <div className="pt-3 border-t border-slate-800/80 flex justify-between text-xs font-mono">
                        <span className="text-slate-400">Calculated Free Water:</span>
                        <span className="text-amber-400 font-bold">+{formatLiquid(calculations.fineFreeWater)} {liquidUnit}</span>
                      </div>
                    </div>
                  </div>

                  <div className="bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-lg">
                    <div className="flex justify-between items-center mb-4">
                      <h3 className="text-md font-bold text-amber-400">Stone / Coarse Aggregate</h3>
                      <span className="text-xs font-mono bg-slate-800 text-slate-300 px-2 py-1 rounded">
                        Dry Base: {formatMass((currentMix.coarseAgg !== undefined ? currentMix.coarseAgg : (currentMix.coarseAgg1 + currentMix.coarseAgg2)) * loadVolume).toLocaleString()} {massUnit}
                      </span>
                    </div>

                    <div className="space-y-4">
                      <div>
                        <div className="flex justify-between text-sm mb-1">
                          <span className="text-slate-300">Total Moisture Content:</span>
                          <span className="font-mono text-amber-400 font-bold">{coarseMoisture}%</span>
                        </div>
                        <input
                          type="range"
                          min="0.0"
                          max="6.0"
                          step="0.1"
                          value={coarseMoisture}
                          onChange={(e) => setCoarseMoisture(parseFloat(e.target.value))}
                          className="w-full accent-amber-500 h-2 bg-slate-800 rounded-lg appearance-none cursor-pointer"
                        />
                      </div>

                      <div>
                        <div className="flex justify-between text-sm mb-1">
                          <span className="text-slate-300">Aggregate Absorption Capacity:</span>

                      className="bg-amber-500 hover:bg-amber-400 text-slate-950 px-4 py-2 rounded-xl text-xs font-bold transition-all flex items-center space-x-1"
                    >
                      <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M17 17h2a2 2 0 002-2v-4a2 2 0 00-2-2H5a2 2 0 00-2 2v4a2 2 0 002 2h2m2 4h6a2 2 0 002-2v-4a2 2 0 00-2-2H9a2 2 0 00-2 2v4a2 2 0 002 2zm8-12V5a2 2 0 00-2-2H9a2 2 0 00-2 2v4h10z"></path></svg>
                      <span>Print Delivery Note</span>
                    </button>
                    <button
                      onClick={() => setShowTicketModal(false)}
                      className="p-2 text-slate-400 hover:text-white hover:bg-slate-800 rounded-xl transition-all"
                      title="Close Modal"
                    >
                      <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M6 18L18 6M6 6l12 12"></path>
                      </svg>
                    </button>
                  </div>
                </div>

                {/* 100% Dynamic / Editable Ticket Configuration Panel */}
                <div className="bg-slate-950 p-4 rounded-xl border border-slate-800 max-h-64 overflow-y-auto space-y-3 no-print">
                  <h4 className="text-xs font-bold uppercase tracking-wider text-amber-400 border-b border-slate-800 pb-1">Edit All Delivery Note Fields & Labels</h4>
                  
                  {/* Company Info */}
                  <div className="grid grid-cols-3 gap-2 text-xs">
                    <div>
                      <label className="text-slate-400 block mb-1">Company Name</label>
                      <input type="text" value={companyName} onChange={(e) => setCompanyName(e.target.value)} className="w-full bg-slate-900 border border-slate-700 rounded px-2 py-1 text-slate-100" />
                    </div>
                    <div>
                      <label className="text-slate-400 block mb-1">Plant Details / Phone</label>
                      <input type="text" value={plantDetails} onChange={(e) => setPlantDetails(e.target.value)} className="w-full bg-slate-900 border border-slate-700 rounded px-2 py-1 text-slate-100" />
                    </div>
                    <div>
                      <label className="text-slate-400 block mb-1">Company Tagline</label>
                      <input type="text" value={companyTagline} onChange={(e) => setCompanyTagline(e.target.value)} className="w-full bg-slate-900 border border-slate-700 rounded px-2 py-1 text-slate-100" />
                    </div>
                  </div>

                  {/* Header Titles & Ticket Numbers */}
                  <div className="grid grid-cols-2 gap-2 text-xs">
                    <div>
                      <label className="text-slate-400 block mb-1">Document Header Title</label>
                      <input type="text" value={ticketTitle} onChange={(e) => setTicketTitle(e.target.value)} className="w-full bg-slate-900 border border-slate-700 rounded px-2 py-1 text-slate-100" />
                    </div>
                    <div>
                      <label className="text-slate-400 block mb-1">Ticket / Delivery Note #</label>
                      <input type="text" value={ticketNo} onChange={(e) => setTicketNo(e.target.value)} className="w-full bg-slate-900 border border-slate-700 rounded px-2 py-1 text-slate-100" />
                    </div>
                  </div>

                  {/* Customer, Location & Logistics */}
                  <div className="grid grid-cols-3 gap-2 text-xs">
                    <div>
                      <label className="text-slate-400 block mb-1">Customer / Contractor</label>
                      <input type="text" value={customer} onChange={(e) => setCustomer(e.target.value)} className="w-full bg-slate-900 border border-slate-700 rounded px-2 py-1 text-slate-100" />
                    </div>
                    <div>
                      <label className="text-slate-400 block mb-1">Delivery Site Address</label>
                      <input type="text" value={siteAddress} onChange={(e) => setSiteAddress(e.target.value)} className="w-full bg-slate-900 border border-slate-700 rounded px-2 py-1 text-slate-100" />
                    </div>
                    <div>
                      <label className="text-slate-400 block mb-1">Dispatch Time</label>
                      <input type="text" value={timeDispatched} onChange={(e) => setTimeDispatched(e.target.value)} className="w-full bg-slate-900 border border-slate-700 rounded px-2 py-1 text-slate-100" />
                    </div>
                    <div>
                      <label className="text-slate-400 block mb-1">Truck ID</label>
                      <input type="text" value={truckNo} onChange={(e) => setTruckNo(e.target.value)} className="w-full bg-slate-900 border border-slate-700 rounded px-2 py-1 text-slate-100" />
                    </div>
                    <div>
                      <label className="text-slate-400 block mb-1">Driver Name</label>
                      <input type="text" value={driver} onChange={(e) => setDriver(e.target.value)} className="w-full bg-slate-900 border border-slate-700 rounded px-2 py-1 text-slate-100" />
                    </div>
                    <div>
                      <label className="text-slate-400 block mb-1">Slump Target</label>
                      <input type="text" value={slumpTarget} onChange={(e) => setSlumpTarget(e.target.value)} className="w-full bg-slate-900 border border-slate-700 rounded px-2 py-1 text-slate-100" />
                    </div>
                  </div>

                  {/* Customizable Labels & Legal Terms */}
                  <div className="grid grid-cols-2 gap-2 text-xs pt-2 border-t border-slate-800">
                    <div>
                      <label className="text-slate-400 block mb-1">Driver Signature Label</label>
                      <input type="text" value={labelDriverSig} onChange={(e) => setLabelDriverSig(e.target.value)} className="w-full bg-slate-900 border border-slate-700 rounded px-2 py-1 text-slate-100" />
                    </div>
                    <div>
                      <label className="text-slate-400 block mb-1">Customer Signature Label</label>
                      <input type="text" value={labelCustSig} onChange={(e) => setLabelCustSig(e.target.value)} className="w-full bg-slate-900 border border-slate-700 rounded px-2 py-1 text-slate-100" />
                    </div>
                    <div>
                      <label className="text-slate-400 block mb-1">Water Added Label</label>
                      <input type="text" value={labelWaterAdded} onChange={(e) => setLabelWaterAdded(e.target.value)} className="w-full bg-slate-900 border border-slate-700 rounded px-2 py-1 text-slate-100" />
                    </div>
                    <div>
                      <label className="text-slate-400 block mb-1">Water Amount Label</label>
                      <input type="text" value={labelWaterAmount} onChange={(e) => setLabelWaterAmount(e.target.value)} className="w-full bg-slate-900 border border-slate-700 rounded px-2 py-1 text-slate-100" />
                    </div>
                    <div>
                      <label className="text-slate-400 block mb-1">Water Added Disclaimer</label>
                      <input type="text" value={waterWarningText} onChange={(e) => setWaterWarningText(e.target.value)} className="w-full bg-slate-900 border border-slate-700 rounded px-2 py-1 text-slate-100" />
                    </div>
                    <div>
                      <label className="text-slate-400 block mb-1">Ticket Disclaimer / Terms</label>
                      <input type="text" value={disclaimerText} onChange={(e) => setDisclaimerText(e.target.value)} className="w-full bg-slate-900 border border-slate-700 rounded px-2 py-1 text-slate-100" />
                    </div>
                  </div>
                </div>

                {/* ACTUAL PRINTABLE TICKET CONTENT - DIRECTLY EDITABLE INLINE */}
                <div id="printable-delivery-note" className="relative bg-white text-black p-8 rounded-lg shadow-inner font-sans border border-slate-200">
                  
                  {/* Top-Right Close Button inside Ticket Header */}
                  <button
                    onClick={() => setShowTicketModal(false)}
                    className="no-print absolute top-4 right-4 p-1.5 text-slate-400 hover:text-slate-900 hover:bg-slate-100 rounded-full transition-all"
                    title="Close Ticket"
                  >
                    <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                      <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M6 18L18 6M6 6l12 12"></path>
                    </svg>
                  </button>

                  {/* Ticket Header */}
                  <div className="flex justify-between items-start border-b-2 border-black pb-4 mb-4 pr-6">
                    <div>
                      <h1 contentEditable="true" suppressContentEditableWarning={true} onBlur={(e) => setCompanyName(e.target.innerText)} className="text-2xl font-black tracking-tight text-black uppercase">{companyName}</h1>
                      <p contentEditable="true" suppressContentEditableWarning={true} onBlur={(e) => setPlantDetails(e.target.innerText)} className="text-xs text-gray-600">{plantDetails}</p>
                      <p contentEditable="true" suppressContentEditableWarning={true} onBlur={(e) => setCompanyTagline(e.target.innerText)} className="text-xs text-gray-600">{companyTagline}</p>
                    </div>
                    <div className="text-right">
                      <h2 contentEditable="true" suppressContentEditableWarning={true} onBlur={(e) => setTicketTitle(e.target.innerText)} className="text-xl font-bold text-black">{ticketTitle}</h2>
                      <p className="text-xs font-mono font-bold text-gray-800">TICKET #: <span contentEditable="true" suppressContentEditableWarning={true} onBlur={(e) => setTicketNo(e.target.innerText)}>{ticketNo}</span></p>
                      <p className="text-xs text-gray-600">Date: {new Date().toLocaleDateString()}</p>
                    </div>
                  </div>

                  {/* Customer & Job Info */}
                  <div className="grid grid-cols-2 gap-4 text-xs mb-6 border border-gray-300 p-3 rounded">
                    <div>
                      <p contentEditable="true" suppressContentEditableWarning={true} onBlur={(e) => setLabelCustomer(e.target.innerText)} className="font-bold text-gray-500 uppercase text-[10px]">{labelCustomer}</p>
                      <p contentEditable="true" suppressContentEditableWarning={true} onBlur={(e) => setCustomer(e.target.innerText)} className="font-semibold text-sm text-black">{customer}</p>
                      <p contentEditable="true" suppressContentEditableWarning={true} onBlur={(e) => setLabelAddress(e.target.innerText)} className="font-bold text-gray-500 uppercase text-[10px] mt-2">{labelAddress}</p>
                      <p contentEditable="true" suppressContentEditableWarning={true} onBlur={(e) => setSiteAddress(e.target.innerText)} className="text-gray-800">{siteAddress}</p>
                    </div>
                    <div>
                      <p><span contentEditable="true" suppressContentEditableWarning={true} onBlur={(e) => setLabelDispatch(e.target.innerText)} className="font-bold text-gray-600">{labelDispatch}</span> <span contentEditable="true" suppressContentEditableWarning={true} onBlur={(e) => setTimeDispatched(e.target.innerText)}>{timeDispatched}</span></p>
                      <p><span contentEditable="true" suppressContentEditableWarning={true} onBlur={(e) => setLabelTruck(e.target.innerText)} className="font-bold text-gray-600">{labelTruck}</span> <span contentEditable="true" suppressContentEditableWarning={true} onBlur={(e) => setTruckNo(e.target.innerText)}>{truckNo}</span></p>
                      <p><span contentEditable="true" suppressContentEditableWarning={true} onBlur={(e) => setLabelDriver(e.target.innerText)} className="font-bold text-gray-600">{labelDriver}</span> <span contentEditable="true" suppressContentEditableWarning={true} onBlur={(e) => setDriver(e.target.innerText)}>{driver}</span></p>
                      <p><span contentEditable="true" suppressContentEditableWarning={true} onBlur={(e) => setLabelSlump(e.target.innerText)} className="font-bold text-gray-600">{labelSlump}</span> <span contentEditable="true" suppressContentEditableWarning={true} onBlur={(e) => setSlumpTarget(e.target.innerText)}>{slumpTarget}</span></p>
                    </div>
                  </div>

                  {/* Mix Specs */}
                  <div className="mb-6">
                    <h3 className="text-xs font-bold uppercase tracking-wider text-gray-700 mb-2 border-b border-gray-200 pb-1">Load & Mix Details</h3>
                    <table className="w-full text-xs text-left border-collapse mb-4">
                      <thead>
                        <tr className="border-b border-gray-300 font-bold bg-gray-50">
                          <th className="py-2 px-1">Mix Design</th>
                          <th className="py-2 px-1 text-center">Load Volume</th>
                          <th className="py-2 px-1 text-center">Est. Discharge Temp</th>
                          <th className="py-2 px-1 text-right">Unit Density</th>
                        </tr>
                      </thead>
                      <tbody>
                        <tr className="border-b border-gray-200 font-mono">
                          <td contentEditable="true" suppressContentEditableWarning={true} className="py-2 px-1 font-sans font-semibold">{currentMix.name}</td>
                          <td contentEditable="true" suppressContentEditableWarning={true} className="py-2 px-1 text-center font-bold text-sm">{formatVol(loadVolume)} {volUnit}</td>
                          <td contentEditable="true" suppressContentEditableWarning={true} className="py-2 px-1 text-center">{formatTemp(calculations.estimatedTempC)}{tempUnit}</td>
                          <td contentEditable="true" suppressContentEditableWarning={true} className="py-2 px-1 text-right">{formatDensity(calculations.wetUnitWeightKgM3)} {densityUnit}</td>
                        </tr>
                      </tbody>
                    </table>

                    <h3 className="text-xs font-bold uppercase tracking-wider text-gray-700 mb-2 border-b border-gray-200 pb-1">Batched Scale Weights (Actual Target)</h3>
                    <table className="w-full text-xs text-left border-collapse font-mono">
                      <thead>
                        <tr className="border-b border-gray-300 font-sans text-[10px] text-gray-500 uppercase">
                          <th className="py-1">Material</th>
                          <th className="py-1 text-right">Design Dry ({massUnit})</th>
                          <th className="py-1 text-right">Moisture Adjustment</th>
                          <th className="py-1 text-right">Batched Scale Weight</th>
                        </tr>
                      </thead>
                      <tbody className="divide-y divide-gray-200">
                        <tr>
                          <td contentEditable="true" suppressContentEditableWarning={true} className="py-1 font-sans">Cement Powder</td>
                          <td contentEditable="true" suppressContentEditableWarning={true} className="py-1 text-right">{formatMass(calculations.baseCement).toLocaleString()}</td>
                          <td contentEditable="true" suppressContentEditableWarning={true} className="py-1 text-right">0 %</td>
                          <td contentEditable="true" suppressContentEditableWarning={true} className="py-1 text-right font-bold">{formatMass(calculations.baseCement).toLocaleString()} {massUnit}</td>
                        </tr>
                        <tr>
                          <td contentEditable="true" suppressContentEditableWarning={true} className="py-1 font-sans font-medium text-slate-800">Fine Aggregate (Sand)</td>
                          <td contentEditable="true" suppressContentEditableWarning={true} className="py-1 text-right">{formatMass(calculations.baseFineDry).toLocaleString()}</td>
                          <td contentEditable="true" suppressContentEditableWarning={true} className="py-1 text-right">+{fineMoisture}%</td>
                          <td contentEditable="true" suppressContentEditableWarning={true} className="py-1 text-right font-bold">{formatMass(calculations.adjustedFineScale).toLocaleString()} {massUnit}</td>
                        </tr>
                        <tr>
                          <td contentEditable="true" suppressContentEditableWarning={true} className="py-1 font-sans font-medium text-slate-800">Coarse Aggregate (Stone)</td>
                          <td contentEditable="true" suppressContentEditableWarning={true} className="py-1 text-right">{formatMass(calculations.baseCoarseDry).toLocaleString()}</td>
                          <td contentEditable="true" suppressContentEditableWarning={true} className="py-1 text-right">+{coarseMoisture}%</td>
                          <td contentEditable="true" suppressContentEditableWarning={true} className="py-1 text-right font-bold">{formatMass(calculations.adjustedCoarseScale).toLocaleString()} {massUnit}</td>
                        </tr>
                        <tr>
                          <td contentEditable="true" suppressContentEditableWarning={true} className="py-1 font-sans font-medium text-slate-800">Net Batch Water</td>
                          <td contentEditable="true" suppressContentEditableWarning={true} className="py-1 text-right">{formatLiquid(calculations.baseWaterDesign).toLocaleString()}</td>
                          <td contentEditable="true" suppressContentEditableWarning={true} className="py-1 text-right">-{formatLiquid(calculations.totalFreeWater)} {liquidUnit} (Free H₂O)</td>
                          <td contentEditable="true" suppressContentEditableWarning={true} className="py-1 text-right font-bold">{formatLiquid(calculations.netWaterScale).toLocaleString()} {liquidUnit}</td>
                        </tr>
                      </tbody>
                    </table>
                  </div>

                  {/* Signatures & Legal Terms */}
                  <div className="mt-8 pt-4 border-t-2 border-gray-300 grid grid-cols-2 gap-8 text-[11px]">
                    <div className="space-y-6">
                      <div>
                        <p contentEditable="true" suppressContentEditableWarning={true} onBlur={(e) => setLabelDriverSig(e.target.innerText)} className="font-bold mb-6">{labelDriverSig}</p>
                        <div className="border-b border-black w-3/4"></div>
                      </div>
                      
                      <div className="pt-2">
                        <p contentEditable="true" suppressContentEditableWarning={true} onBlur={(e) => setLabelWaterAdded(e.target.innerText)} className="font-bold mb-2">{labelWaterAdded}</p>
                        <div className="flex items-center space-x-2 mb-4">
                          <span contentEditable="true" suppressContentEditableWarning={true} onBlur={(e) => setLabelWaterAmount(e.target.innerText)} className="font-semibold text-gray-700">{labelWaterAmount}</span>
                          <div className="border-b border-black w-1/2"></div>
                        </div>
                        <div className="border-b border-black w-3/4"></div>
                        <p className="text-[9px] text-gray-500 mt-1">Signature for water added</p>
                        <p contentEditable="true" suppressContentEditableWarning={true} onBlur={(e) => setWaterWarningText(e.target.innerText)} className="text-[9px] font-semibold text-gray-700 mt-1">{waterWarningText}</p>
                      </div>
                    </div>

                    <div>
                      <p contentEditable="true" suppressContentEditableWarning={true} onBlur={(e) => setLabelCustSig(e.target.innerText)} className="font-bold mb-6">{labelCustSig}</p>
                      <div className="border-b border-black w-3/4"></div>
                      <p contentEditable="true" suppressContentEditableWarning={true} onBlur={(e) => setDisclaimerText(e.target.innerText)} className="text-[9px] text-gray-500 mt-1">{disclaimerText}</p>
                    </div>
                  </div>

                  {/* Dedicated On-Ticket Print Button (Hidden during print) */}
                  <div className="no-print mt-6 pt-4 border-t border-slate-200 flex justify-end space-x-3">
                    <button
                      onClick={() => setShowTicketModal(false)}
                      className="px-4 py-2 bg-slate-200 hover:bg-slate-300 text-slate-800 rounded-lg text-xs font-semibold transition-all"
                    >
                      Close Window
                    </button>
                    <button
                      onClick={() => window.print()}
                      className="px-4 py-2 bg-emerald-600 hover:bg-emerald-500 text-white rounded-lg text-xs font-bold transition-all flex items-center space-x-1 shadow-md"
                    >
                      <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M17 17h2a2 2 0 002-2v-4a2 2 0 00-2-2H5a2 2 0 00-2 2v4a2 2 0 002 2h2m2 4h6a2 2 0 002-2v-4a2 2 0 00-2-2H9a2 2 0 00-2 2v4a2 2 0 002 2zm8-12V5a2 2 0 00-2-2H9a2 2 0 00-2 2v4h10z"></path></svg>
                      <span>Print Ticket</span>
                    </button>
                  </div>

                </div>

              </div>
            </div>
          )}

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
