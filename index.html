<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BatchCraft Pro – Plant Management Engine</title>

  <script src="https://cdn.tailwindcss.com"></script>

  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap');
    
    body {
      font-family: 'Inter', sans-serif;
    }
    .font-mono {
      font-family: 'JetBrains Mono', monospace;
    }

    /* PRINT FIX: Hide the screen app entirely and reveal dedicated print markup */
    @media print {
      #root {
        display: none !important;
      }
      #print-mount {
        display: block !important;
        width: 100% !important;
        margin: 0 !important;
        padding: 0 !important;
        background: #ffffff !important;
        color: #000000 !important;
      }
      @page {
        size: A4 portrait;
        margin: 12mm;
      }
    }

    @media screen {
      #print-mount {
        display: none !important;
      }
    }
  </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen">
  <div id="root"></div>
  <div id="print-mount"></div>

  <script type="text/babel">
    const { useState } = React;

    function BatchCraftApp() {
      const [showTicket, setShowTicket] = useState(false);

      // Editable Ticket State
      const [ticketData, setTicketData] = useState({
        customer: "BuildCo Construction Ltd",
        address: "124 Main Street, Commercial Zone",
        dispatchTime: "13:22",
        truckNo: "TR-14",
        driver: "J. Doe",
        slump: "100 mm",
        ticketNo: "DN-84920",
        date: "01/09/2026"
      });

      const handleChange = (e) => {
        const { name, value } = e.target;
        setTicketData(prev => ({ ...prev, [name]: value }));
      };

      const handlePrint = () => {
        // Render print element directly into the isolated body container
        const mount = document.getElementById('print-mount');
        mount.innerHTML = `
          <div style="font-family: 'Inter', sans-serif; color: #000; padding: 10px;">
            <div style="display: flex; justify-content: space-between; border-bottom: 2px solid #000; padding-bottom: 12px; margin-bottom: 20px;">
              <div>
                <h2 style="font-size: 22px; font-weight: 900; margin: 0; text-transform: uppercase;">BatchCraft Concrete Ltd.</h2>
                <p style="font-size: 11px; margin: 2px 0 0 0; color: #444;">Central Batching Plant #04 • Tel: (011) 555-0192</p>
                <p style="font-size: 11px; margin: 0; color: #666;">Quality Assured Ready-Mix Concrete</p>
              </div>
              <div style="text-align: right;">
                <h3 style="font-size: 16px; font-weight: 800; margin: 0;">DELIVERY NOTE</h3>
                <p style="font-size: 11px; font-family: monospace; font-weight: 700; margin: 2px 0 0 0;">TICKET #: ${ticketData.ticketNo}</p>
                <p style="font-size: 11px; margin: 0; color: #444;">Date: ${ticketData.date}</p>
              </div>
            </div>

            <div style="border: 1px solid #ccc; border-radius: 6px; padding: 12px; margin-bottom: 20px; font-size: 11px; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; background-color: #f9f9f9;">
              <div>
                <p style="color: #666; font-weight: bold; font-size: 9px; margin: 0; text-transform: uppercase;">Customer / Contractor</p>
                <p style="font-weight: bold; font-size: 13px; margin: 2px 0 8px 0;">${ticketData.customer}</p>
                <p style="color: #666; font-weight: bold; font-size: 9px; margin: 0; text-transform: uppercase;">Delivery Location</p>
                <p style="font-weight: 500; margin: 2px 0 0 0;">${ticketData.address}</p>
              </div>
              <div>
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px;">
                  <div>
                    <p style="color: #666; font-weight: bold; font-size: 9px; margin: 0; text-transform: uppercase;">Dispatch Time</p>
                    <p style="font-weight: 600; margin: 2px 0 0 0;">${ticketData.dispatchTime}</p>
                  </div>
                  <div>
                    <p style="color: #666; font-weight: bold; font-size: 9px; margin: 0; text-transform: uppercase;">Truck No</p>
                    <p style="font-weight: 600; margin: 2px 0 0 0;">${ticketData.truckNo}</p>
                  </div>
                  <div>
                    <p style="color: #666; font-weight: bold; font-size: 9px; margin: 0; text-transform: uppercase;">Driver</p>
                    <p style="font-weight: 600; margin: 2px 0 0 0;">${ticketData.driver}</p>
                  </div>
                  <div>
                    <p style="color: #666; font-weight: bold; font-size: 9px; margin: 0; text-transform: uppercase;">Target Slump</p>
                    <p style="font-weight: 600; margin: 2px 0 0 0;">${ticketData.slump}</p>
                  </div>
                </div>
              </div>
            </div>

            <div style="margin-bottom: 20px;">
              <h4 style="font-size: 11px; font-weight: bold; margin: 0 0 8px 0; text-transform: uppercase;">Load & Mix Details</h4>
              <table style="width: 100%; font-size: 11px; border-collapse: collapse; text-align: left;">
                <thead>
                  <tr style="border-bottom: 1px solid #aaa; color: #555;">
                    <th style="padding: 6px 0;">Mix Design</th>
                    <th style="padding: 6px 0; text-align: center;">Load Volume</th>
                    <th style="padding: 6px 0; text-align: center;">Est. Discharge Temp</th>
                    <th style="padding: 6px 0; text-align: right;">Unit Density</th>
                  </tr>
                </thead>
                <tbody>
                  <tr style="border-bottom: 1px solid #ddd; font-weight: 600;">
                    <td style="padding: 8px 0;">30 MPa Standard Structural</td>
                    <td style="padding: 8px 0; text-align: center; font-size: 12px; font-weight: bold;">6 m³</td>
                    <td style="padding: 8px 0; text-align: center;">25.2 °C</td>
                    <td style="padding: 8px 0; text-align: right; font-family: monospace;">2398 kg/m³</td>
                  </tr>
                </tbody>
              </table>
            </div>

            <div style="margin-bottom: 30px;">
              <h4 style="font-size: 11px; font-weight: bold; margin: 0 0 8px 0; text-transform: uppercase;">Batched Scale Weights (Actual Target)</h4>
              <table style="width: 100%; font-size: 11px; border-collapse: collapse; text-align: left;">
                <thead>
                  <tr style="border-bottom: 2px solid #000; color: #333;">
                    <th style="padding: 6px 0;">Material</th>
                    <th style="padding: 6px 0; text-align: right;">Design Dry (kg)</th>
                    <th style="padding: 6px 0; text-align: right;">Moisture Adjustment</th>
                    <th style="padding: 6px 0; text-align: right;">Batched Scale Weight</th>
                  </tr>
                </thead>
                <tbody style="font-family: monospace;">
                  <tr style="border-bottom: 1px solid #eee;">
                    <td style="padding: 6px 0; font-family: sans-serif; font-weight: 500;">Cement Powder</td>
                    <td style="padding: 6px 0; text-align: right; color: #555;">2100</td>
                    <td style="padding: 6px 0; text-align: right; color: #555;">0 %</td>
                    <td style="padding: 6px 0; text-align: right; font-weight: bold;">2100 kg</td>
                  </tr>
                  <tr style="border-bottom: 1px solid #eee;">
                    <td style="padding: 6px 0; font-family: sans-serif; font-weight: 500;">Fine Aggregate (Sand)</td>
                    <td style="padding: 6px 0; text-align: right; color: #555;">4920</td>
                    <td style="padding: 6px 0; text-align: right; color: #555;">+4.5%</td>
                    <td style="padding: 6px 0; text-align: right; font-weight: bold;">5141 kg</td>
                  </tr>
                  <tr style="border-bottom: 1px solid #eee;">
                    <td style="padding: 6px 0; font-family: sans-serif; font-weight: 500;">Coarse Aggregate (Stone)</td>
                    <td style="padding: 6px 0; text-align: right; color: #555;">6240</td>
                    <td style="padding: 6px 0; text-align: right; color: #555;">+1.8%</td>
                    <td style="padding: 6px 0; text-align: right; font-weight: bold;">6352 kg</td>
                  </tr>
                  <tr style="border-bottom: 1px solid #eee;">
                    <td style="padding: 6px 0; font-family: sans-serif; font-weight: 500;">Net Batch Water</td>
                    <td style="padding: 6px 0; text-align: right; color: #555;">1050</td>
                    <td style="padding: 6px 0; text-align: right; color: #555;">-253 L (Free H₂O)</td>
                    <td style="padding: 6px 0; text-align: right; font-weight: bold;">797 L</td>
                  </tr>
                </tbody>
              </table>
            </div>

            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 30px; padding-top: 20px; border-top: 1px solid #ccc; font-size: 11px;">
              <div>
                <p style="font-weight: bold; margin: 0 0 40px 0;">Plant Operator Signature:</p>
                <div style="border-bottom: 1px solid #888;"></div>
              </div>
              <div>
                <p style="font-weight: bold; margin: 0 0 40px 0;">Site Customer Acceptance Signature:</p>
                <div style="border-bottom: 1px solid #888;"></div>
                <p style="font-size: 9px; color: #666; margin: 4px 0 0 0;">Received in good condition. Additional site water added voids warranty.</p>
              </div>
            </div>
          </div>
        `;
        window.print();
      };

          {/* Header Bar */}
          <header class="flex justify-between items-center pb-6 border-b border-slate-800 mb-8">
            <div class="flex items-center space-x-3">
              <div class="bg-amber-500 text-slate-950 font-bold p-2 rounded-lg text-xl">BC</div>
              <div>
                <h1 class="text-xl font-bold tracking-tight text-white">BatchCraft <span class="text-xs bg-amber-500/20 text-amber-400 px-2 py-0.5 rounded border border-amber-500/30">PRO</span></h1>
                <p class="text-xs text-slate-400">Concrete Batching & Quality Control System</p>
              </div>
            </div>

              onClick={() => setShowTicket(true)}
              class="bg-emerald-600 hover:bg-emerald-500 text-white font-medium px-4 py-2 rounded-lg transition-colors shadow-lg shadow-emerald-950/50 flex items-center space-x-2"
            >
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
              <span>View Delivery Note</span>
            </button>
          </header>

          {/* Main Dashboard Preview */}
          <main class="grid grid-cols-1 md:grid-cols-3 gap-6">
            <div class="bg-slate-800/60 border border-slate-700/50 p-5 rounded-xl">
              <h2 class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Active Mix Design</h2>
              <p class="text-lg font-semibold text-amber-400">30 MPa Standard Structural</p>
            </div>
            <div class="bg-slate-800/60 border border-slate-700/50 p-5 rounded-xl">
              <h2 class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Calculated Volume</h2>
              <p class="text-lg font-semibold text-emerald-400">6.00 m³</p>
            </div>
            <div class="bg-slate-800/60 border border-slate-700/50 p-5 rounded-xl">
              <h2 class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Plant Status</h2>
              <p class="text-lg font-semibold text-blue-400">Ready to Batch</p>
            </div>
          </main>

          {/* Delivery Ticket Modal with Interactive Form Inputs */}
          {showTicket && (
            <div class="fixed inset-0 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4 z-50 overflow-y-auto">
              <div class="bg-slate-900 border border-slate-800 rounded-xl max-w-2xl w-full my-8 overflow-hidden shadow-2xl">
                
                {/* Form Field Controls */}
                <div class="bg-slate-950 p-5 border-b border-slate-800">
                  <h3 class="text-xs font-bold text-amber-400 uppercase tracking-wider mb-3">Edit Ticket Details</h3>
                  <div class="grid grid-cols-1 md:grid-cols-2 gap-3 text-xs">
                    <div>
                      <label class="block text-slate-400 mb-1">Customer / Contractor Name</label>
                      <input type="text" name="customer" value={ticketData.customer} onChange={handleChange} class="w-full bg-slate-900 border border-slate-700 rounded px-3 py-1.5 text-white focus:outline-none focus:border-amber-500" />
                    </div>
                    <div>
                      <label class="block text-slate-400 mb-1">Delivery Site Address</label>
                      <input type="text" name="address" value={ticketData.address} onChange={handleChange} class="w-full bg-slate-900 border border-slate-700 rounded px-3 py-1.5 text-white focus:outline-none focus:border-amber-500" />
                    </div>
                    <div>
                      <label class="block text-slate-400 mb-1">Dispatch Time</label>
                      <input type="text" name="dispatchTime" value={ticketData.dispatchTime} onChange={handleChange} class="w-full bg-slate-900 border border-slate-700 rounded px-3 py-1.5 text-white focus:outline-none focus:border-amber-500" />
                    </div>
                    <div>
                      <label class="block text-slate-400 mb-1">Truck ID</label>
                      <input type="text" name="truckNo" value={ticketData.truckNo} onChange={handleChange} class="w-full bg-slate-900 border border-slate-700 rounded px-3 py-1.5 text-white focus:outline-none focus:border-amber-500" />
                    </div>
                    <div>
                      <label class="block text-slate-400 mb-1">Driver Name</label>
                      <input type="text" name="driver" value={ticketData.driver} onChange={handleChange} class="w-full bg-slate-900 border border-slate-700 rounded px-3 py-1.5 text-white focus:outline-none focus:border-amber-500" />
                    </div>
                    <div>
                      <label class="block text-slate-400 mb-1">Slump Target</label>
                      <input type="text" name="slump" value={ticketData.slump} onChange={handleChange} class="w-full bg-slate-900 border border-slate-700 rounded px-3 py-1.5 text-white focus:outline-none focus:border-amber-500" />
                    </div>
                  </div>
                </div>

                {/* Printable Ticket Live Preview */}
                <div class="bg-white text-slate-900 p-8">
                  <div class="flex justify-between items-start border-b-2 border-slate-900 pb-4 mb-6">
                    <div>
                      <h2 class="text-2xl font-black tracking-tight text-slate-950 uppercase">BatchCraft Concrete Ltd.</h2>
                      <p class="text-xs text-slate-600 font-medium">Central Batching Plant #04 • Tel: (011) 555-0192</p>
                      <p class="text-xs text-slate-500">Quality Assured Ready-Mix Concrete</p>
                    </div>
                    <div class="text-right">
                      <h3 class="text-lg font-extrabold text-slate-900">DELIVERY NOTE</h3>
                      <p class="text-xs font-mono font-semibold text-slate-700">TICKET #: {ticketData.ticketNo}</p>
                      <p class="text-xs text-slate-600">Date: {ticketData.date}</p>
                    </div>
                  </div>

                  <div class="border border-slate-200 rounded-lg p-4 mb-6 text-xs grid grid-cols-2 gap-4 bg-slate-50">
                    <div>
                      <p class="text-slate-500 uppercase font-bold text-[10px]">Customer / Contractor</p>
                      <p class="font-bold text-slate-900 text-sm">{ticketData.customer}</p>
                      <p class="text-slate-500 uppercase font-bold text-[10px] mt-2">Delivery Location</p>
                      <p class="text-slate-800 font-medium">{ticketData.address}</p>
                    </div>
                    <div>
                      <div class="grid grid-cols-2 gap-2">
                        <div>
                          <p class="text-slate-500 uppercase font-bold text-[10px]">Dispatch Time</p>
                          <p class="font-semibold text-slate-800">{ticketData.dispatchTime}</p>
                        </div>
                        <div>
                          <p class="text-slate-500 uppercase font-bold text-[10px]">Truck No</p>
                          <p class="font-semibold text-slate-800">{ticketData.truckNo}</p>
                        </div>
                        <div>
                          <p class="text-slate-500 uppercase font-bold text-[10px]">Driver</p>
                          <p class="font-semibold text-slate-800">{ticketData.driver}</p>
                        </div>
                        <div>
                          <p class="text-slate-500 uppercase font-bold text-[10px]">Target Slump</p>
                          <p class="font-semibold text-slate-800">{ticketData.slump}</p>
                        </div>
                      </div>
                    </div>
                  </div>

                  <div class="mb-6">
                    <h4 class="text-xs font-bold text-slate-900 uppercase tracking-wider mb-2">Load & Mix Details</h4>
                    <table class="w-full text-xs text-left border-collapse">
                      <thead>
                        <tr class="border-b border-slate-300 text-slate-600">
                          <th class="py-2 font-bold">Mix Design</th>
                          <th class="py-2 font-bold text-center">Load Volume</th>
                          <th class="py-2 font-bold text-center">Est. Discharge Temp</th>
                          <th class="py-2 font-bold text-right">Unit Density</th>
                        </tr>
                      </thead>
                      <tbody>
                        <tr class="border-b border-slate-200 font-semibold text-slate-900">
                          <td class="py-2.5">30 MPa Standard Structural</td>
                          <td class="py-2.5 text-center text-sm font-bold">6 m³</td>
                          <td class="py-2.5 text-center">25.2 °C</td>
                          <td class="py-2.5 text-right font-mono">2398 kg/m³</td>
                        </tr>
                      </tbody>
                    </table>
                  </div>

                  <div class="mb-8">
                    <h4 class="text-xs font-bold text-slate-900 uppercase tracking-wider mb-2">Batched Scale Weights (Actual Target)</h4>
                    <table class="w-full text-xs text-left border-collapse">
                      <thead>
                        <tr class="border-b-2 border-slate-900 text-slate-700">
                          <th class="py-2 font-bold">Material</th>
                          <th class="py-2 font-bold text-right">Design Dry (kg)</th>
                          <th class="py-2 font-bold text-right">Moisture Adjustment</th>
                          <th class="py-2 font-bold text-right">Batched Scale Weight</th>
                        </tr>
                      </thead>
                      <tbody class="divide-y divide-slate-200 font-mono">
                        <tr>
                          <td class="py-2 font-sans font-medium text-slate-900">Cement Powder</td>
                          <td class="py-2 text-right text-slate-600">2100</td>
                          <td class="py-2 text-right text-slate-600">0 %</td>
                          <td class="py-2 text-right font-bold text-slate-900">2100 kg</td>
                        </tr>
                        <tr>
                          <td class="py-2 font-sans font-medium text-slate-900">Fine Aggregate (Sand)</td>
                          <td class="py-2 text-right text-slate-600">4920</td>
                          <td class="py-2 text-right text-slate-600">+4.5%</td>
                          <td class="py-2 text-right font-bold text-slate-900">5141 kg</td>
                        </tr>
                        <tr>
                          <td class="py-2 font-sans font-medium text-slate-900">Coarse Aggregate (Stone)</td>
                          <td class="py-2 text-right text-slate-600">6240</td>
                          <td class="py-2 text-right text-slate-600">+1.8%</td>
                          <td class="py-2 text-right font-bold text-slate-900">6352 kg</td>
                        </tr>
                        <tr>
                          <td class="py-2 font-sans font-medium text-slate-900">Net Batch Water</td>
                          <td class="py-2 text-right text-slate-600">1050</td>

                      </tbody>

                      <p class="font-bold text-slate-900 mb-8">Plant Operator Signature:</p>
                      <div class="border-b border-slate-400"></div>
                    </div>
                    <div>
                      <p class="font-bold text-slate-900 mb-8">Site Customer Acceptance Signature:</p>
                      <div class="border-b border-slate-400"></div>
                      <p class="text-[10px] text-slate-500 mt-1">Received in good condition. Additional site water added voids warranty.</p>
                    </div>
                  </div>
                </div>

                {/* Modal Footer */}
                <div class="p-4 bg-slate-950 border-t border-slate-800 flex justify-end space-x-3">
                  <button 
                    onClick={() => setShowTicket(false)}
                    class="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-slate-300 font-medium text-sm rounded-lg transition-colors"
                  >
                    Close Window
                  </button>
                  <button 
                    onClick={handlePrint}
                    class="px-4 py-2 bg-emerald-600 hover:bg-emerald-500 text-white font-medium text-sm rounded-lg transition-colors flex items-center space-x-2 shadow-lg shadow-emerald-950/50"
                  >
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 17h2a2 2 0 002-2v-4a2 2 0 00-2-2H5a2 2 0 00-2 2v4a2 2 0 002 2h2m2 4h6a2 2 0 002-2v-4a2 2 0 00-2-2H9a2 2 0 00-2 2v4a2 2 0 002 2zm8-12V5a2 2 0 00-2-2H9a2 2 0 00-2 2v4h10z"></path></svg>

                  </button>
                </div>

              </div>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<BatchCraftApp />);
  </script>
</body>
</html>
