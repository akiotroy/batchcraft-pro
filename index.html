<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BatchCraft Pro – Plant Management Engine</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap');
    
    body {
      font-family: 'Inter', sans-serif;
      background-color: #0b0f19;
      color: #f3f4f6;
    }
    
    .font-mono {
      font-family: 'JetBrains Mono', monospace;
    }

    /* Target editable elements for clear user interaction */
    input[type=range] {
      accent-color: #f59e0b;
    }

    /* Dedicated CSS Print Engine Override */
    @media print {
      body > div:not(#print-root) {
        display: none !important;
      }

      html, body {
        background: #ffffff !important;
        color: #000000 !important;
        margin: 0 !important;
        padding: 0 !important;
        height: auto !important;
        overflow: visible !important;
        -webkit-print-color-adjust: exact !important;
        print-color-adjust: exact !important;
      }

      .no-print {
        display: none !important;
      }

      .print-only-container {
        display: block !important;
        position: relative !important;
        top: 0 !important;
        left: 0 !important;
        width: 100% !important;
        height: auto !important;
        background: #ffffff !important;
        color: #000000 !important;
        box-shadow: none !important;
        border: none !important;
        margin: 0 !important;
        padding: 0 !important;
      }

      .print-only-container * {
        color: #000000 !important;
        background: transparent !important;
        border-color: #d1d5db !important;
        box-shadow: none !important;
      }

      .print-table, .print-table th, .print-table td {
        border: 1px solid #000000 !important;
        border-collapse: collapse !important;
      }
    }
  </style>
</head>
<body>

  <div id="root"></div>

  <script type="text/babel">
    const { useState } = React;

    function App() {
      const [activeTab, setActiveTab] = useState('trim');
      const [showModal, setShowModal] = useState(false);
      const [unitSystem, setUnitSystem] = useState('metric'); // 'metric' or 'imperial'
      
      // Base Batch state parameters (Metric Defaults)
      const [truckVolumeMetric, setTruckVolumeMetric] = useState(6.0); // m3
      const [sandMoisture, setSandMoisture] = useState(4.5);
      const [sandAbs, setSandAbs] = useState(1.0);
      const [stoneMoisture, setStoneMoisture] = useState(1.8);
      const [stoneAbs, setStoneAbs] = useState(0.5);

      const isMetric = unitSystem === 'metric';

      // Base design specs (Metric 1m3)
      const baseCementMetric = 350; // kg/m3
      const baseSandMetric = 820;   // kg/m3
      const baseStoneMetric = 1040; // kg/m3
      const baseWaterMetric = 175;  // L/m3

      // Conversion constants
      const KG_TO_LBS = 2.20462;
      const M3_TO_YD3 = 1.30795;
      const L_TO_GAL = 0.264172;

      // Current Volume
      const volumeVal = isMetric ? truckVolumeMetric : (truckVolumeMetric * M3_TO_YD3);
      const volUnit = isMetric ? 'm³' : 'yd³';
      const massUnit = isMetric ? 'kg' : 'lbs';
      const liquidUnit = isMetric ? 'L' : 'gal';
      const densityUnit = isMetric ? 'kg/m³' : 'lbs/yd³';

      // Dynamic Batch base calculations based on selected unit
      const totalDrySand = (baseSandMetric * truckVolumeMetric) * (isMetric ? 1 : KG_TO_LBS);
      const totalDryStone = (baseStoneMetric * truckVolumeMetric) * (isMetric ? 1 : KG_TO_LBS);
      const totalDryWater = (baseWaterMetric * truckVolumeMetric) * (isMetric ? 1 : L_TO_GAL);
      const totalDryCement = (baseCementMetric * truckVolumeMetric) * (isMetric ? 1 : KG_TO_LBS);

      // Free moisture calculations
      const sandFreeWater = (totalDrySand * (sandMoisture - sandAbs)) / 100;
      const stoneFreeWater = (totalDryStone * (stoneMoisture - stoneAbs)) / 100;
      const totalFreeWater = sandFreeWater + stoneFreeWater;

      // Trimmed Targets
      const finalSandTarget = totalDrySand + sandFreeWater;
      const finalStoneTarget = totalDryStone + stoneFreeWater;
      const finalWaterTarget = totalDryWater - totalFreeWater;

      // Yield & Density calculations
      const estimatedDensity = isMetric ? 2398 : Math.round(2398 * KG_TO_LBS / M3_TO_YD3); // ~4041 lbs/yd3
      const totalBatchMassKg = (baseCementMetric + baseSandMetric + baseStoneMetric + baseWaterMetric) * truckVolumeMetric;
      const calculatedYield = ((totalBatchMassKg / 2398) * (isMetric ? 1 : M3_TO_YD3)).toFixed(2);

      const triggerPrint = () => {
        window.print();
      };

      return (
        <div className="min-h-screen bg-[#0b0f19] text-gray-100 p-4 md:p-8">
          
          {/* Header Bar */}
          <header className="flex flex-wrap items-center justify-between gap-4 mb-8 pb-6 border-b border-gray-800">
            <div className="flex items-center gap-3">
              <div className="w-10 h-10 rounded-lg bg-amber-500 text-slate-950 font-bold flex items-center justify-center text-xl shadow-lg shadow-amber-500/20">
                BC
              </div>
              <div>
                <div className="flex items-center gap-2">
                  <h1 className="text-xl font-bold tracking-tight text-white">BatchCraft</h1>
                  <span className="bg-amber-500/10 text-amber-500 text-xs font-semibold px-2 py-0.5 rounded border border-amber-500/20">PRO</span>
                </div>
                <p className="text-xs text-gray-400">Concrete Batching & Yield Optimization Engine</p>
              </div>
            </div>

            <div className="flex flex-wrap items-center gap-3">
              {/* Unit System Switcher */}
              <div className="bg-gray-900 border border-gray-800 p-1 rounded-lg flex items-center gap-1 text-xs font-semibold">
                <button 
                  onClick={() => setUnitSystem('metric')}
                  className={`px-3 py-1.5 rounded-md transition ${isMetric ? 'bg-amber-500 text-slate-950' : 'text-gray-400 hover:text-white'}`}
                >
                  Metric (kg / m³)
                </button>
                <button 
                  onClick={() => setUnitSystem('imperial')}
                  className={`px-3 py-1.5 rounded-md transition ${!isMetric ? 'bg-amber-500 text-slate-950' : 'text-gray-400 hover:text-white'}`}
                >
                  US / Imperial (lbs / yd³)
                </button>
              </div>

              <button 
                onClick={() => setShowModal(true)}
                className="px-4 py-2 rounded-lg bg-emerald-600 hover:bg-emerald-500 text-white font-medium text-sm flex items-center gap-2 shadow-lg shadow-emerald-600/20 transition"
              >
                <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
                Delivery Note
              </button>
            </div>
          </header>

          {/* Key Metrics Banner */}
          <div className="grid grid-cols-1 md:grid-cols-3 gap-4 mb-8">
            <div className="bg-[#121826] border border-gray-800 rounded-xl p-5">
              <span className="text-xs uppercase tracking-wider text-gray-400 font-semibold">Active Mix Design</span>
              <div className="mt-2 text-lg font-bold text-amber-400">
                <select className="bg-gray-900 border border-gray-700 text-amber-400 font-bold rounded px-3 py-1.5 w-full focus:outline-none focus:border-amber-500">
                  <option>{isMetric ? '30 MPa Standard Structural (w/c: 0.5)' : '4000 PSI Standard Structural (w/c: 0.5)'}</option>
                  <option>{isMetric ? '25 MPa Foundation Mix' : '3000 PSI Foundation Mix'}</option>
                  <option>{isMetric ? '40 MPa Pavement High-Early' : '5000 PSI Pavement High-Early'}</option>
                </select>
              </div>
            </div>

            <div className="bg-[#121826] border border-gray-800 rounded-xl p-5">
              <div className="flex justify-between items-center">
                <span className="text-xs uppercase tracking-wider text-gray-400 font-semibold">Batch Truck Volume</span>
                <span className="text-amber-400 font-bold font-mono text-lg">{volumeVal.toFixed(1)} {volUnit}</span>
              </div>
              <input 
                type="range" 
                min="1.0" 
                max="12.0" 
                step="0.5" 
                value={truckVolumeMetric}
                onChange={(e) => setTruckVolumeMetric(parseFloat(e.target.value))}
                className="w-full mt-3"
              />
              <div className="flex justify-between text-xs text-gray-500 mt-1 font-mono">
                <span>{isMetric ? '1.0 m³' : '1.3 yd³'}</span>
                <span>{isMetric ? '6.0 m³' : '7.8 yd³'}</span>
                <span>{isMetric ? '12.0 m³' : '15.7 yd³'}</span>
              </div>
            </div>

            <div className="bg-[#121826] border border-gray-800 rounded-xl p-5 flex justify-between items-center">
              <div>
                <span className="text-xs uppercase tracking-wider text-gray-400 font-semibold">Estimated Unit Density</span>
                <div className="text-2xl font-bold font-mono text-white mt-1">{estimatedDensity.toLocaleString()} <span className="text-sm font-normal text-gray-400">{densityUnit}</span></div>
              </div>
              <div className="text-right">
                <span className="text-xs uppercase tracking-wider text-gray-400 font-semibold">Calculated Vol. Yield</span>
                <div className="text-2xl font-bold font-mono text-emerald-400 mt-1">{calculatedYield} <span className="text-sm font-normal text-gray-400">{volUnit}</span></div>
              </div>
            </div>
          </div>

          {/* Main Workspace Layout */}
          <div className="grid grid-cols-1 lg:grid-cols-12 gap-6">
            
            {/* Left Controls Column */}
            <div className="lg:col-span-5 space-y-6">
              
              {/* Fine Aggregate Card */}
              <div className="bg-[#121826] border border-gray-800 rounded-xl p-5">
                <div className="flex justify-between items-center mb-4">
                  <h3 className="font-semibold text-amber-400">Sand / Fine Aggregate</h3>
                  <span className="text-xs font-mono text-gray-400 bg-gray-800 px-2 py-1 rounded">Dry Base: {Math.round(totalDrySand).toLocaleString()} {massUnit}</span>
                </div>
                
                <div className="space-y-4">
                  <div>
                    <div className="flex justify-between text-sm mb-1">
                      <span className="text-gray-300">Total Moisture Content:</span>
                      <span className="font-mono text-amber-400 font-semibold">{sandMoisture}%</span>
                    </div>
                    <input 
                      type="range" 
                      min="0.0" 
                      max="10.0" 
                      step="0.1" 
                      value={sandMoisture}
                      onChange={(e) => setSandMoisture(parseFloat(e.target.value))}
                      className="w-full"
                    />
                  </div>

                  <div>
                    <div className="flex justify-between text-sm mb-1">
                      <span className="text-gray-300">Aggregate Absorption Capacity:</span>
                      <span className="font-mono text-gray-400">{sandAbs}%</span>
                    </div>
                    <input 
                      type="range" 
                      min="0.0" 
                      max="3.0" 
                      step="0.1" 
                      value={sandAbs}
                      onChange={(e) => setSandAbs(parseFloat(e.target.value))}
                      className="w-full"
                    />
                  </div>

                  <div className="pt-2 border-t border-gray-800 flex justify-between text-xs">
                    <span className="text-gray-400">Calculated Free Water:</span>
                    <span className="font-mono text-amber-400 font-semibold">+{sandFreeWater.toFixed(1)} {isMetric ? 'Liters' : 'Gallons'}</span>
                  </div>
                </div>
              </div>

              {/* Coarse Aggregate Card */}
              <div className="bg-[#121826] border border-gray-800 rounded-xl p-5">
                <div className="flex justify-between items-center mb-4">
                  <h3 className="font-semibold text-amber-400">Stone / Coarse Aggregate</h3>
                  <span className="text-xs font-mono text-gray-400 bg-gray-800 px-2 py-1 rounded">Dry Base: {Math.round(totalDryStone).toLocaleString()} {massUnit}</span>
                </div>
                
                <div className="space-y-4">
                  <div>
                    <div className="flex justify-between text-sm mb-1">
                      <span className="text-gray-300">Total Moisture Content:</span>
                      <span className="font-mono text-amber-400 font-semibold">{stoneMoisture}%</span>
                    </div>
                    <input 
                      type="range" 
                      min="0.0" 
                      max="6.0" 
                      step="0.1" 
                      value={stoneMoisture}
                      onChange={(e) => setStoneMoisture(parseFloat(e.target.value))}
                      className="w-full"
                    />
                  </div>

                  <div>
                    <div className="flex justify-between text-sm mb-1">
                      <span className="text-gray-300">Aggregate Absorption Capacity:</span>
                      <span className="font-mono text-gray-400">{stoneAbs}%</span>
                    </div>
                    <input 
                      type="range" 
                      min="0.0" 
                      max="2.0" 
                      step="0.1" 
                      value={stoneAbs}
                      onChange={(e) => setStoneAbs(parseFloat(e.target.value))}
                      className="w-full"
                    />
                  </div>

                  <div className="pt-2 border-t border-gray-800 flex justify-between text-xs">
                    <span className="text-gray-400">Calculated Free Water:</span>
                    <span className="font-mono text-amber-400 font-semibold">+{stoneFreeWater.toFixed(1)} {isMetric ? 'Liters' : 'Gallons'}</span>
                  </div>
                </div>
              </div>

            </div>

            {/* Right Output Scale Table Column */}
            <div className="lg:col-span-7">
              <div className="bg-[#121826] border border-gray-800 rounded-xl p-6 h-full flex flex-col justify-between">
                <div>
                  <div className="flex justify-between items-center mb-6">
                    <div>
                      <h2 className="text-lg font-bold text-white">Live Scale Weight Trim Output</h2>
                      <p className="text-xs text-gray-400">Target weights to program into plant automated scale hoppers</p>
                    </div>
                    <span className="bg-emerald-500/10 text-emerald-400 text-xs font-semibold px-2.5 py-1 rounded-full border border-emerald-500/20">
                      Ready for Batching
                    </span>
                  </div>

                  <div className="overflow-x-auto">
                    <table className="w-full text-left text-sm">
                      <thead>
                        <tr className="border-b border-gray-800 text-xs text-gray-400 uppercase tracking-wider">
                          <th className="pb-3 font-semibold">Material</th>
                          <th className="pb-3 text-right font-semibold">Design (Dry)</th>
                          <th className="pb-3 text-right font-semibold">Moisture Trim</th>
                          <th className="pb-3 text-right font-semibold text-amber-400">Scale Target</th>
                        </tr>
                      </thead>
                      <tbody className="divide-y divide-gray-800/60 font-mono">
                        <tr>
                          <td className="py-3.5 font-sans font-medium text-white">Cement Powder</td>
                          <td className="py-3.5 text-right text-gray-400">{Math.round(totalDryCement).toLocaleString()} {massUnit}</td>
                          <td className="py-3.5 text-right text-gray-500">—</td>
                          <td className="py-3.5 text-right font-bold text-white">{Math.round(totalDryCement).toLocaleString()} {massUnit}</td>
                        </tr>
                        <tr>
                          <td className="py-3.5 font-sans font-medium text-white">Fine Aggregate (Sand)</td>
                          <td className="py-3.5 text-right text-gray-400">{Math.round(totalDrySand).toLocaleString()} {massUnit}</td>
                          <td className="py-3.5 text-right text-amber-400">+{Math.round(sandFreeWater)} {massUnit}</td>
                          <td className="py-3.5 text-right font-bold text-amber-400">{Math.round(finalSandTarget).toLocaleString()} {massUnit}</td>
                        </tr>
                        <tr>
                          <td className="py-3.5 font-sans font-medium text-white">Coarse Aggregate (Stone)</td>
                          <td className="py-3.5 text-right text-gray-400">{Math.round(totalDryStone).toLocaleString()} {massUnit}</td>
                          <td className="py-3.5 text-right text-amber-400">+{Math.round(stoneFreeWater)} {massUnit}</td>
                          <td className="py-3.5 text-right font-bold text-amber-400">{Math.round(finalStoneTarget).toLocaleString()} {massUnit}</td>
                        </tr>
                        <tr>
                          <td className="py-3.5 font-sans font-medium text-white">Batch Water (Net)</td>
                          <td className="py-3.5 text-right text-gray-400">{Math.round(totalDryWater).toLocaleString()} {liquidUnit}</td>
                          <td className="py-3.5 text-right text-rose-400">-{Math.round(totalFreeWater)} {liquidUnit}</td>
                          <td className="py-3.5 text-right font-bold text-cyan-400">{Math.round(finalWaterTarget).toLocaleString()} {liquidUnit}</td>
                        </tr>
                      </tbody>
                    </table>
                  </div>
                </div>

                <div className="mt-8 bg-rose-500/10 border border-rose-500/20 rounded-lg p-4 flex items-center justify-between">
                  <div className="flex items-center gap-3">
                    <span className="w-2.5 h-2.5 rounded-full bg-rose-500 animate-pulse"></span>
                    <div>
                      <div className="text-sm font-semibold text-white">Total Water Trimmed From Mix</div>
                      <div className="text-xs text-gray-400">Subtracted to compensate for free moisture in aggregates</div>
                    </div>
                  </div>
                  <div className="text-xl font-bold font-mono text-rose-400">
                    -{Math.round(totalFreeWater)} <span className="text-sm font-normal">{isMetric ? 'Liters' : 'Gallons'}</span>
                  </div>
                </div>

              </div>
            </div>

          </div>

          {/* PRINTABLE DELIVERY NOTE MODAL */}
          {showModal && (
            <div className="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-4 no-print">
              <div className="bg-white text-gray-900 rounded-xl shadow-2xl max-w-2xl w-full p-6 md:p-8 max-h-[90vh] overflow-y-auto">
                
                {/* Printable Document Container */}
                <div id="printable-ticket" className="print-only-container space-y-6">
                  
                  {/* Ticket Header */}
                  <div className="flex justify-between items-start border-b border-gray-300 pb-4">
                    <div>
                      <h1 className="text-2xl font-bold text-gray-900 tracking-tight">READY MIX DELIVERY TICKET</h1>
                      <p className="text-xs text-gray-600">BatchCraft Pro Yield & QC Management</p>
                    </div>
                    <div className="text-right font-mono text-xs text-gray-600">
                      <div>Ticket #: <span className="font-bold text-gray-900">BC-2026-0941</span></div>
                      <div>Date: 01/09/2026</div>
                    </div>
                  </div>

                  {/* Customer / Project Info */}
                  <div className="grid grid-cols-2 gap-4 text-xs">
                    <div className="border border-gray-200 p-3 rounded">
                      <div className="font-bold text-gray-700 uppercase mb-1">Customer / Project</div>
                      <div className="font-semibold text-gray-900">Apex Structural Developments</div>
                      <div className="text-gray-600">Site: Hennopspark Commercial Expansion</div>
                    </div>
                    <div className="border border-gray-200 p-3 rounded">
                      <div className="font-bold text-gray-700 uppercase mb-1">Batch Details</div>
                      <div>Truck Load: <span className="font-bold text-gray-900 font-mono">{volumeVal.toFixed(1)} {volUnit}</span></div>
                      <div>Mix Spec: <span className="font-bold text-gray-900">{isMetric ? '30 MPa Structural' : '4000 PSI Structural'}</span></div>
                    </div>
                  </div>

                  {/* Batch Weight Breakdown */}
                  <div>
                    <div className="font-bold text-xs uppercase tracking-wider text-gray-700 mb-2">Batched Scale Weights (Trimmed - {isMetric ? 'Metric' : 'US Imperial'})</div>
                    <table className="w-full text-xs text-left border border-gray-300 print-table">
                      <thead className="bg-gray-100 border-b border-gray-300">
                        <tr>
                          <th className="p-2 font-bold">Material Description</th>
                          <th className="p-2 text-right font-bold">Target Batch Weight</th>
                        </tr>
                      </thead>
                      <tbody className="divide-y divide-gray-200 font-mono">
                        <tr>
                          <td className="p-2">Cement Type I/II</td>
                          <td className="p-2 text-right font-bold">{Math.round(totalDryCement).toLocaleString()} {massUnit}</td>
                        </tr>
                        <tr>
                          <td className="p-2">Fine Agg (Sand @ {sandMoisture}% H2O)</td>
                          <td className="p-2 text-right font-bold">{Math.round(finalSandTarget).toLocaleString()} {massUnit}</td>
                        </tr>
                        <tr>
                          <td className="p-2">Coarse Agg (Stone @ {stoneMoisture}% H2O)</td>
                          <td className="p-2 text-right font-bold">{Math.round(finalStoneTarget).toLocaleString()} {massUnit}</td>
                        </tr>
                        <tr>
                          <td className="p-2">Trimmed Batch Water</td>
                          <td className="p-2 text-right font-bold">{Math.round(finalWaterTarget).toLocaleString()} {liquidUnit}</td>
                        </tr>
                      </tbody>
                    </table>
                  </div>

                  {/* Signatures */}
                  <div className="grid grid-cols-2 gap-6 pt-6 border-t border-gray-300 text-xs">
                    <div>
                      <div className="font-semibold mb-8 text-gray-700">Plant Operator Signature:</div>
                      <div className="border-b border-gray-400 w-full"></div>
                    </div>
                    <div>
                      <div className="font-semibold mb-8 text-gray-700">Site Customer Acceptance Signature:</div>
                      <div className="border-b border-gray-400 w-full"></div>
                      <div className="text-[10px] text-gray-500 mt-1">Received in good condition. Additional site water added voids warranty.</div>
                    </div>
                  </div>

                </div>

                {/* Modal Action Buttons */}
                <div className="flex justify-end gap-3 mt-8 pt-4 border-t border-gray-200 no-print">
                  <button 
                    onClick={() => setShowModal(false)}
                    className="px-4 py-2 bg-gray-200 hover:bg-gray-300 text-gray-800 text-sm font-semibold rounded-lg transition"
                  >
                    Close Window
                  </button>
                  <button 
                    onClick={triggerPrint}
                    className="px-4 py-2 bg-emerald-600 hover:bg-emerald-500 text-white text-sm font-semibold rounded-lg shadow transition flex items-center gap-2"
                  >
                    <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M17 17h2a2 2 0 002-2v-4a2 2 0 00-2-2H5a2 2 0 00-2 2v4a2 2 0 002 2h2m2 4h6a2 2 0 002-2v-4a2 2 0 00-2-2H9a2 2 0 00-2 2v4a2 2 0 002 2zm8-12V5a2 2 0 00-2-2H9a2 2 0 00-2 2v4h10z"></path></svg>
                    Print Ticket
                  </button>
                </div>

              </div>
            </div>
          )}

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
