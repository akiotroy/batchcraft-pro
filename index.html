<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BatchCraft Pro – Plant Management Engine</title>

  <script src="https://cdn.tailwindcss.com"></script>

  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap');
    
    body {
      font-family: 'Inter', sans-serif;
    }
    .font-mono {
      font-family: 'JetBrains Mono', monospace;
    }

    /* PRINT STYLESHEET - FIXES BLANK PRINT PREVIEW */
    @media print {
      /* Hide all UI elements except the active printable ticket container */
      body * {
        visibility: hidden !important;
      }

      /* Isolate the ticket container for printing */
      #printable-ticket, #printable-ticket * {
        visibility: visible !important;
      }

      /* Position ticket at the absolute top-left of the paper */
      #printable-ticket {
        position: absolute !important;
        left: 0 !important;
        top: 0 !important;
        width: 100% !important;
        margin: 0 !important;
        padding: 0 !important;
        background: #ffffff !important;
        color: #000000 !important;
        box-shadow: none !important;
        border: none !important;
      }

      /* Hide modal controls and close buttons from print output */
      .no-print {
        display: none !important;
      }

      @page {
        size: A4 portrait;
        margin: 15mm;
      }
    }
  </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen">
  <div id="root"></div>

  <script type="text/babel">
    const { useState } = React;

    function BatchCraftApp() {
      const [showTicket, setShowTicket] = useState(false);

      const handlePrint = () => {
        window.print();
      };

      return (
        <div class="p-6 max-w-6xl mx-auto">
          {/* Header Bar */}
          <header class="flex justify-between items-center pb-6 border-b border-slate-800 mb-8 no-print">
            <div class="flex items-center space-x-3">
              <div class="bg-amber-500 text-slate-950 font-bold p-2 rounded-lg text-xl">BC</div>
              <div>
                <h1 class="text-xl font-bold tracking-tight text-white">BatchCraft <span class="text-xs bg-amber-500/20 text-amber-400 px-2 py-0.5 rounded border border-amber-500/30">PRO</span></h1>
                <p class="text-xs text-slate-400">Concrete Batching & Quality Control System</p>
              </div>
            </div>
            
            <button 
              onClick={() => setShowTicket(true)}
              class="bg-emerald-600 hover:bg-emerald-500 text-white font-medium px-4 py-2 rounded-lg transition-colors shadow-lg shadow-emerald-950/50 flex items-center space-x-2"
            >
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
              <span>View Delivery Note</span>
            </button>
          </header>

          {/* Main Dashboard Preview */}
          <main class="grid grid-cols-1 md:grid-cols-3 gap-6 no-print">
            <div class="bg-slate-800/60 border border-slate-700/50 p-5 rounded-xl">
              <h2 class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Active Mix Design</h2>
              <p class="text-lg font-semibold text-amber-400">30 MPa Standard Structural</p>
            </div>
            <div class="bg-slate-800/60 border border-slate-700/50 p-5 rounded-xl">
              <h2 class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Calculated Volume</h2>
              <p class="text-lg font-semibold text-emerald-400">6.00 m³</p>
            </div>
            <div class="bg-slate-800/60 border border-slate-700/50 p-5 rounded-xl">
              <h2 class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Plant Status</h2>
              <p class="text-lg font-semibold text-blue-400">Ready to Batch</p>
            </div>
          </main>

          {/* Delivery Ticket Modal */}
          {showTicket && (
            <div class="fixed inset-0 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4 z-50">
              <div class="bg-slate-900 border border-slate-800 rounded-xl max-w-2xl w-full overflow-hidden shadow-2xl">
                
                {/* Printable Area Wrapper */}
                <div id="printable-ticket" class="bg-white text-slate-900 p-8">
                  
                  {/* Header */}
                  <div class="flex justify-between items-start border-b-2 border-slate-900 pb-4 mb-6">
                    <div>
                      <h2 class="text-2xl font-black tracking-tight text-slate-950 uppercase">BatchCraft Concrete Ltd.</h2>
                      <p class="text-xs text-slate-600 font-medium">Central Batching Plant #04 • Tel: (011) 555-0192</p>
                      <p class="text-xs text-slate-500">Quality Assured Ready-Mix Concrete</p>
                    </div>
                    <div class="text-right">
                      <h3 class="text-lg font-extrabold text-slate-900">DELIVERY NOTE</h3>
                      <p class="text-xs font-mono font-semibold text-slate-700">TICKET #: DN-84920</p>
                      <p class="text-xs text-slate-600">Date: 01/09/2026</p>
                    </div>
                  </div>

                  {/* Metadata Grid */}
                  <div class="border border-slate-200 rounded-lg p-4 mb-6 text-xs grid grid-cols-2 gap-4 bg-slate-50">
                    <div>
                      <p class="text-slate-500 uppercase font-bold text-[10px]">Customer / Contractor</p>
                      <p class="font-bold text-slate-900 text-sm">BuildCo Construction Ltd</p>
                      <p class="text-slate-500 uppercase font-bold text-[10px] mt-2">Delivery Location</p>
                      <p class="text-slate-800 font-medium">124 Main Street, Commercial Zone</p>
                    </div>
                    <div>
                      <div class="grid grid-cols-2 gap-2">
                        <div>
                          <p class="text-slate-500 uppercase font-bold text-[10px]">Dispatch Time</p>
                          <p class="font-semibold text-slate-800">13:15</p>
                        </div>
                        <div>
                          <p class="text-slate-500 uppercase font-bold text-[10px]">Truck No</p>
                          <p class="font-semibold text-slate-800">TR-14</p>
                        </div>
                        <div>
                          <p class="text-slate-500 uppercase font-bold text-[10px]">Driver</p>
                          <p class="font-semibold text-slate-800">J. Doe</p>
                        </div>
                        <div>
                          <p class="text-slate-500 uppercase font-bold text-[10px]">Target Slump</p>
                          <p class="font-semibold text-slate-800">100 mm</p>
                        </div>
                      </div>
                    </div>
                  </div>

                  {/* Load Details */}
                  <div class="mb-6">
                    <h4 class="text-xs font-bold text-slate-900 uppercase tracking-wider mb-2">Load & Mix Details</h4>
                    <table class="w-full text-xs text-left border-collapse">
                      <thead>
                        <tr class="border-b border-slate-300 text-slate-600">
                          <th class="py-2 font-bold">Mix Design</th>
                          <th class="py-2 font-bold text-center">Load Volume</th>
                          <th class="py-2 font-bold text-center">Est. Discharge Temp</th>
                          <th class="py-2 font-bold text-right">Unit Density</th>
                        </tr>
                      </thead>
                      <tbody>
                        <tr class="border-b border-slate-200 font-semibold text-slate-900">
                          <td class="py-2.5">30 MPa Standard Structural</td>
                          <td class="py-2.5 text-center text-sm font-bold">6 m³</td>
                          <td class="py-2.5 text-center">25.2 °C</td>
                          <td class="py-2.5 text-right font-mono">2398 kg/m³</td>
                        </tr>
                      </tbody>
                    </table>
                  </div>

                  {/* Batched Weights Table */}
                  <div class="mb-8">
                    <h4 class="text-xs font-bold text-slate-900 uppercase tracking-wider mb-2">Batched Scale Weights (Actual Target)</h4>
                    <table class="w-full text-xs text-left border-collapse">
                      <thead>
                        <tr class="border-b-2 border-slate-900 text-slate-700">
                          <th class="py-2 font-bold">Material</th>
                          <th class="py-2 font-bold text-right">Design Dry (kg)</th>
                          <th class="py-2 font-bold text-right">Moisture Adjustment</th>
                          <th class="py-2 font-bold text-right">Batched Scale Weight</th>
                        </tr>
                      </thead>
                      <tbody class="divide-y divide-slate-200 font-mono">
                        <tr>
                          <td class="py-2 font-sans font-medium text-slate-900">Cement Powder</td>
                          <td class="py-2 text-right text-slate-600">2100</td>
                          <td class="py-2 text-right text-slate-600">0 %</td>
                          <td class="py-2 text-right font-bold text-slate-900">2100 kg</td>
                        </tr>
                        <tr>
                          <td class="py-2 font-sans font-medium text-slate-900">Fine Aggregate (Sand)</td>
                          <td class="py-2 text-right text-slate-600">4920</td>
                          <td class="py-2 text-right text-slate-600">+4.5%</td>
                          <td class="py-2 text-right font-bold text-slate-900">5141 kg</td>
                        </tr>
                        <tr>
                          <td class="py-2 font-sans font-medium text-slate-900">Coarse Aggregate (Stone)</td>
                          <td class="py-2 text-right text-slate-600">6240</td>
                          <td class="py-2 text-right text-slate-600">+1.8%</td>
                          <td class="py-2 text-right font-bold text-slate-900">6352 kg</td>
                        </tr>
                        <tr>
                          <td class="py-2 font-sans font-medium text-slate-900">Net Batch Water</td>
                          <td class="py-2 text-right text-slate-600">1050</td>
                          <td class="py-2 text-right text-slate-600">-253 L (Free H₂O)</td>
                          <td class="py-2 text-right font-bold text-slate-900">797 L</td>
                        </tr>
                      </tbody>
                    </table>
                  </div>

                  {/* Signatures */}
                  <div class="grid grid-cols-2 gap-8 pt-6 border-t border-slate-300 text-xs">
                    <div>
                      <p class="font-bold text-slate-900 mb-8">Plant Operator Signature:</p>
                      <div class="border-b border-slate-400"></div>
                    </div>
                    <div>
                      <p class="font-bold text-slate-900 mb-8">Site Customer Acceptance Signature:</p>
                      <div class="border-b border-slate-400"></div>
                      <p class="text-[10px] text-slate-500 mt-1">Received in good condition. Additional site water added voids warranty.</p>
                    </div>
                  </div>

                </div>

                {/* Modal Controls (Hidden during print) */}
                <div class="p-4 bg-slate-950 border-t border-slate-800 flex justify-end space-x-3 no-print">
                  <button 
                    onClick={() => setShowTicket(false)}
                    class="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-slate-300 font-medium text-sm rounded-lg transition-colors"
                  >
                    Close Window
                  </button>
                  <button 
                    onClick={handlePrint}
                    class="px-4 py-2 bg-emerald-600 hover:bg-emerald-500 text-white font-medium text-sm rounded-lg transition-colors flex items-center space-x-2 shadow-lg shadow-emerald-950/50"
                  >
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 17h2a2 2 0 002-2v-4a2 2 0 00-2-2H5a2 2 0 00-2 2v4a2 2 0 002 2h2m2 4h6a2 2 0 002-2v-4a2 2 0 00-2-2H9a2 2 0 00-2 2v4a2 2 0 002 2zm8-12V5a2 2 0 00-2-2H9a2 2 0 00-2 2v4h10z"></path></svg>
                    <span>Print Ticket</span>
                  </button>
                </div>

              </div>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<BatchCraftApp />);
  </script>
</body>
</html>
